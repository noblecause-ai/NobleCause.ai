name: Research — drei Scouts und nächster Ratsvorsitz

on:
  schedule:
    # Tägliche Fälligkeitskontrolle holt auch einen verspäteten Montagstrigger nach.
    # Nur schedule.next_research löst bezahlte Recherche aus, regulär Montag 06 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Nur Anschluss und Fälligkeit prüfen, ohne Modellaufrufe'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  research:
    uses: ./.github/workflows/regular-operation.yml
    with:
      kind: research
      check_only: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
    secrets: inherit
