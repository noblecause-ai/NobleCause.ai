name: Ratssitzung — autonomer Live-Betrieb

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Nur Anschluss und Fälligkeit prüfen, ohne Modellaufrufe'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  session:
    uses: ./.github/workflows/regular-operation.yml
    with:
      kind: session
      check_only: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
    secrets: inherit
