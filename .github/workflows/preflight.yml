name: OpenRouter-Statusbericht — ohne Modellaufrufe

# Tägliche kostenlose Metadatenprüfung der fünf Ratssitze und drei Scouts.
# Auf Steward-Wunsch nur Statusbericht, ohne Failure-Mail oder Issue-Kommentar.
# Strikte Ausführungsgates bleiben in regular-operation.yml unverändert.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      session_budget:
        description: 'Vollständiges Sitzungsbudget prüfen, ohne Modellaufrufe'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  canary:
    name: Anschlussstatus protokollieren (ohne Alarm)
    # Auch Infrastrukturfehler dieses reinen Monitors lösen keinen Workflow-Alarm aus.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r gremium/requirements.txt

      - name: Schlüssel, festgelegte Endpunkte und Budget prüfen
        id: preflight
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHECK_SESSION_BUDGET: ${{ inputs.session_budget }}
        run: |
          set -o pipefail
          ARGS=()
          if [ "$CHECK_SESSION_BUDGET" = 'true' ]; then ARGS+=(--session-budget); fi
          python3 gremium/preflight.py "${ARGS[@]}" 2>&1 | tee run.log

      - name: Tatsächlichen Anschlussstatus festhalten
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          REMAINING_CREDITS: ${{ steps.preflight.outputs.remaining }}
        run: python3 gremium/preflight_report.py

      - name: Diagnosebelege aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-status-${{ github.run_id }}
          path: |
            preflight-status.json
            run.log
          retention-days: 30
          if-no-files-found: warn
