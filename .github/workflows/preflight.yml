name: Preflight — OpenRouter und Budget

# Tägliche kostenlose Metadatenprüfung der fünf Ratssitze und drei Scouts.
# Keine Inferenz. Der bestehende Key-Deckel wird niemals verändert.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: OpenRouter-Anschluss (ohne Inferenz)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r gremium/requirements.txt

      - name: Schlüssel, festgelegte Endpunkte und Budget prüfen
        id: preflight
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          python3 gremium/preflight.py 2>&1 | tee run.log

      - name: Niedriges Budget einmalig melden
        if: always() && steps.preflight.outputs.low_budget == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING_CREDITS: ${{ steps.preflight.outputs.remaining }}
        run: |
          gh label create 'budget:openrouter' --color D4C5F9 --description 'OpenRouter-Budget wird knapp' 2>/dev/null || true
          NUMBER=$(gh issue list --label 'budget:openrouter' --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then exit 0; fi
          printf 'Unter dem bestehenden OpenRouter-Key-Limit bleiben %s Credits. Der Betrieb erhöht dieses Limit nicht. Beim Erreichen stoppt er weitere Modellaufrufe.\n' "$REMAINING_CREDITS" > budget-notice.md
          gh issue create --title 'OpenRouter: weniger als 10 Credits verfügbar' --label 'budget:openrouter' --body-file budget-notice.md

      - name: Behobenen Budgethinweis schließen
        if: steps.preflight.outputs.low_budget == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-ci-failure.sh 'budget:openrouter' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Behobenen Preflight-Alarm schließen
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-ci-failure.sh "ci-failure:preflight" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fehler als Issue melden
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="ci-failure:preflight"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create "$LABEL" --color B60205 --description "Automatischer CI-Fehler" 2>/dev/null || true
          TAIL=$(tail -c 3000 run.log 2>/dev/null || echo "(kein Log erfasst)")
          BODY=$(printf '**Canary fehlgeschlagen** (mind. ein Key fehlt/leer oder Anbieter nicht erreichbar): %s\n\n```\n%s\n```' "$RUN_URL" "$TAIL")
          NUM=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "CI-Fehler: Key-Canary (preflight)" --label "$LABEL" --body "$BODY"
          fi
